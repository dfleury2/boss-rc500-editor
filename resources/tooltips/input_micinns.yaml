Parameter: MIC IN NS

Explanation:
  Specifies the depth of the noise suppressor that is applied to the audio input from the MIC IN jack
  during loop recording.
  <br>
  * The noise suppressor is not applied to the bypass sound.

Explanation.fr:
  Spécifie la profondeur du suppresseur de bruit appliqué à l'entrée audio de la prise MIC IN pendant
  l'enregistrement de la boucle.
  <br>
  * Le suppresseur de bruit n'est pas appliqué au son direct (bypass).

Values: [0, 50, 100]
Join: "-"
Default: 1
