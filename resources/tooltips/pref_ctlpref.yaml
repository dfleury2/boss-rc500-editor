Parameter: CTL1–2 PREF

Explanation:
  Selects whether a footswitch (CTL1, CTL2) connected to the CTL 1, 2/EXP jack perform the functions
  specified by each memory or the functions specified by the system settings.

Explanation.fr:
  Sélectionne si un commutateur au pied (CTL1, CTL2) connecté à la prise CTL 1, 2/EXP exécute les
  fonctions spécifiées par chaque mémoire ou les fonctions spécifiées par les paramètres système.

Details:
  - Value: MEMORY
    Detail:
      Use the functions that are assigned for each memory.
    Detail.fr:
      Utilise les fonctions assignées à chaque mémoire.

  - Value: SYSTEM
    Default: True
    Detail:
      "Use the functions that are assigned for the system.
      <br>CTL1: LOOP FX
      <br>CTL2: MEMORY INC"
    Detail.fr:
      "Utilise les fonctions assignées au système.
      <br>CTL1 : LOOP FX
      <br>CTL2 : MEMORY INC"
